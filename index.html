<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mercury - Financial Management</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="background">
        <div class="container">
            <div class="content-container">
                <div class="content-box">
                    <div class="image-container">
                        <!-- Background image will be added via CSS -->
                    </div>
                    <div class="border"></div>
                    <div class="content">
                        <div class="header">
                            <div class="tag">
                                <span>Financial Management</span>
                            </div>
                            <div class="title-container">
                                <h1>A simpler, <br>smarter basic</h1>
                                <div class="credit-card">
                                    <span class="credit">credit</span>
                                    <span class="card">card.</span>
                                </div>
                            </div>
                            <p class="description">Your powerful companion on the road to financial success! Explore personal budget management, investment opportunities.</p>
                        </div>
                        <div class="cta-section">
                            <a href="#" class="app-store-btn">
                                <img src="assets/images/app_store_icon.svg" alt="App Store Icon">
                                <span>App Store</span>
                            </a>
                            <div class="stats">
                                <div class="user-avatars">
                                    <div class="avatar"></div>
                                    <div class="avatar"></div>
                                    <div class="avatar"></div>
                                </div>
                                <div class="user-count">
                                    <strong>24K+</strong>
                                    <span>Active User</span>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="bottom-section">
                <p class="bottom-text">The platform fueling today's high-growth revenue teams</p>
                <div class="logo-container">
                    <div class="logo">
                        <img src="assets/images/logo_vector_1.svg" alt="Logo Part 1">
                        <img src="assets/images/logo_vector_2.svg" alt="Logo Part 2">
                    </div>
                    <div class="logo">
                        <img src="assets/images/logo_vector_3.svg" alt="Logo Part 3">
                        <img src="assets/images/logo_vector_4.svg" alt="Logo Part 4">
                        <img src="assets/images/logo_vector_5.svg" alt="Logo Part 5">
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
